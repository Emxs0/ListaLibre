<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini CRUD - Lista de Tareas</title>
  <link rel="stylesheet" href="index 1.css"/>
</head>
<body>
  <h1>📋 Mi Lista de Tareas</h1>
  <input type="text" id="tarea" placeholder="Escribe una tarea...">
  <button class="add-btn" onclick="agregarTarea()">Agregar</button>

  <ul id="lista"></ul>

  <script>
    let lista = document.getElementById("lista");

    function agregarTarea() {
      let tareaTexto = document.getElementById("tarea").value;
      if (tareaTexto === "") return;

      let li = document.createElement("li");
      li.innerHTML = `
        <input type="checkbox" onclick="toggleCompletado(this)">
        <span>${tareaTexto}</span>        
        <button class="delete-btn" onclick="eliminarTarea(this)">Eliminar</button>
      `;
      lista.appendChild(li);
      document.getElementById("tarea").value = "";
    }

    function eliminarTarea(boton) {
      let li = boton.parentElement;
      lista.removeChild(li);
    }

    function toggleCompletado(checkbox) {
      let li = checkbox.parentElement;
      li.classList.toggle("completed");
    }

    function eliminarTarea(botonEliminar) {
      let li = botonEliminar.parentElement;
      lista.removeChild(li);
    }

    function editarTarea(boton) {
      let li = boton.parentElement;
      let span = li.querySelector("span");
      let textoActual = span.textContent;
      
      // Crear input de edición
      let input = document.createElement("input");
      input.type = "text";
      input.value = textoActual;
      input.className = "edit-input";
      
      // Reemplazar el span con el input
      li.replaceChild(input, span);
      
      // Cambiar el botón a "Guardar"
      boton.textContent = "Guardar";
      boton.setAttribute("onclick", "guardarTarea(this)");
      
      // Enfocar el input automáticamente
      input.focus();
    }



  </script>
</body>
</html>
